name: travel-booking

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_password}
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
    ports:
      - '5432:5432'
    volumes:
      - ./resources/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-booking_user} -d ${POSTGRES_DB:-booking_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking_network

  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./resources/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: booking_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Desktop mode: no pgAdmin login screen and no master password prompt --
      # convenient for a local-only dev tool. Never expose this port publicly.
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80' # web UI: http://localhost:5050
    volumes:
      - ./resources/pgadmin:/var/lib/pgadmin
      # Pre-registers the `postgres` service as a connection so there is
      # nothing to fill in by hand (password is POSTGRES_PASSWORD).
      - ./pgadmin.servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80/misc/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - booking_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: booking_mailpit
    restart: unless-stopped
    ports:
      - '8026:8025' # web UI: view every email the app sends, at http://localhost:8026
      # SMTP (1025) is intentionally NOT published to the host -- only the
      # backend container needs it, over the internal booking_network.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking_network

  app:
    build:
      context: ./nextapp
      target: development
    container_name: booking_app
    restart: unless-stopped
    env_file:
      - ./nextapp/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking_user}:${POSTGRES_PASSWORD:-booking_password}@postgres:5432/${POSTGRES_DB:-booking_db}?schema=public
      REDIS_URL: redis://redis:6379
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '5173:5173'
    volumes:
      - ./nextapp/src:/app/src
      - ./nextapp/public:/app/public
      # Mounted so config changes apply on a restart instead of silently
      # requiring an image rebuild.
      - ./nextapp/next.config.js:/app/next.config.js
      - ./nextapp/instrumentation.js:/app/instrumentation.js
      # Local-driver uploads land here (see server/services/uploadService.js's
      # UPLOAD_ROOT = process.cwd()/uploads, served by app/uploads/[...path]/route.js)
      # -- bind-mounted, like every other stateful bind mount, under
      # ./resources/, so files survive a container recreate instead of living
      # only in the container's writable layer.
      - ./resources/uploads:/app/uploads
      - app_node_modules:/app/node_modules
      # Keeps Next's build cache off the host and out of the bind mounts, so a
      # rebuilt container starts warm instead of recompiling every route.
      - app_next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:5173/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    command: sh -c "npm run db:migrate && npm run dev"
    networks:
      - booking_network

networks:
  booking_network:
    driver: bridge

volumes:
  # node_modules/.next stay named volumes, not bind mounts: this Mac and the
  # Linux app container need different native binaries in node_modules (see
  # the sharp ERR_DLOPEN_FAILED fixed earlier) -- bind-mounting it would
  # reintroduce that mismatch every time the container starts.
  app_node_modules:
  app_next_cache:
