# Stack-level CI: brings the real docker-compose.yml up and verifies the
# application works end to end inside it.
#
# ci.yml checks each package in isolation (lint, unit/integration tests against
# service containers, bundle build). This workflow checks the thing we actually
# ship: the images build, the stack boots, migrations apply, seeds load, and the
# HTTP surface behaves -- auth, RBAC, availability, the booking lifecycle,
# double-booking prevention, payments, invoices, cancellation, reports.
name: Docker Compose CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A stack run is expensive and self-contained; superseded runs on the same ref
# are of no interest.
concurrency:
  group: compose-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Boot the stack and verify it
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Mirrors docker-compose.yml's defaults; the dev tool containers
      # (Mailpit, pgAdmin) come up with the stack and are smoke-checked too.
      COMPOSE_PROJECT_NAME: travel-booking-ci
      API_URL: http://localhost:4000/api/v1
      WEB_URL: http://localhost:5173
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
      POSTGRES_DB: booking_db
      TEST_DB: booking_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env files from the committed templates
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Build images
        run: docker compose build

      # --wait blocks until every service with a healthcheck reports healthy,
      # so a boot failure fails here rather than surfacing as a confusing
      # connection error in a later step.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Show service status
        run: docker compose ps

      # The backend container runs `prisma migrate deploy` as part of its start
      # command; this asserts it actually happened rather than assuming it.
      - name: Verify migrations are applied
        run: docker compose exec -T backend npx prisma migrate status

      - name: Seed demo data
        run: docker compose exec -T backend npm run seed

      - name: Seeding is idempotent
        run: docker compose exec -T backend npm run seed

      # Jest truncates tables between suites, so it gets its own database
      # instead of the freshly seeded one the smoke test needs.
      - name: Backend tests (own database)
        env:
          TEST_DATABASE_URL: postgresql://booking_user:booking_password@postgres:5432/booking_test?schema=public
        run: |
          docker compose exec -T postgres createdb -U "$POSTGRES_USER" "$TEST_DB"
          docker compose exec -T -e DATABASE_URL="$TEST_DATABASE_URL" backend npx prisma migrate deploy
          docker compose exec -T -e DATABASE_URL="$TEST_DATABASE_URL" backend npm test

      - name: Frontend tests
        run: docker compose exec -T frontend npm test

      - name: End-to-end smoke test
        run: ./.github/scripts/smoke.sh

      # A failed step above usually only makes sense with the container logs
      # next to it, so capture them for the run summary.
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=400 | tee compose-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  production-images:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compose runs the `development` stages; these are the stages deploy.yml
      # ships, so they are built (not pushed) on every change.
      - name: Build backend production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          load: true
          tags: travel-booking-backend:ci
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          load: true
          tags: travel-booking-frontend:ci
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      # The frontend production image is nginx serving the built bundle, so it
      # can be started and probed on its own.
      - name: Frontend production image serves the app
        run: |
          docker run -d --name frontend-prod -p 8080:80 travel-booking-frontend:ci
          for _ in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/ >/dev/null; then
              echo "nginx is serving the bundle"
              docker rm -f frontend-prod
              exit 0
            fi
            sleep 2
          done
          echo "Production frontend image did not serve a response"
          docker logs frontend-prod
          docker rm -f frontend-prod
          exit 1
