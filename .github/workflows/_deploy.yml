# Reusable deploy workflow: build + push the single `app` image to GHCR, then
# roll it out on one EC2 instance over SSH and smoke-test the result through
# nginx.
#
# Called by staging.yml (environment: staging) and production.yml
# (environment: production). Each caller maps its own environment-prefixed
# secrets (e.g. STAGING_EC2_HOST / PROD_EC2_HOST) onto the generic secret
# names declared below, so this file itself never hardcodes an environment.
#
# Assumption: the old main.yml used unprefixed secret names for production
# (AWS_EC2_IP_ADDRESS, AWS_HOST_USER, PRIVATE_KEY, POSTGRES_*, JWT_*, SMTP_*,
# etc). production.yml maps those same names through unchanged; staging.yml
# expects a parallel STAGING_-prefixed set to already exist in the repo's
# "staging" environment secrets. Exact staging secret names are a guess since
# no staging environment existed in the original workflow.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deploy environment name (staging | production)'
        required: true
        type: string
      image_tag:
        description: 'Existing image tag (commit SHA) to deploy. Leave blank to build this ref.'
        required: false
        type: string
    secrets:
      ec2_host:
        required: true
      ssh_user:
        required: true
      ssh_private_key:
        required: true
      postgres_user:
        required: true
      postgres_password:
        required: true
      postgres_db:
        required: true
      jwt_secret:
        required: true
      jwt_refresh_secret:
        required: true
      payment_gateway:
        required: false
      email_provider:
        required: false
      smtp_host:
        required: false
      smtp_port:
        required: false
      smtp_user:
        required: false
      smtp_password:
        required: false
      smtp_from:
        required: false
      sms_provider:
        required: false
      whatsapp_provider:
        required: false

permissions:
  contents: read
  packages: write
  issues: write

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/travel-booking-app:${{ inputs.environment }}-latest

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_SHA"; fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull previous image for layer cache
        if: inputs.image_tag == ''
        run: docker pull ${{ env.APP_IMAGE }} || true

      - name: Build image
        if: inputs.image_tag == ''
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target production \
            --cache-from ${{ env.APP_IMAGE }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ env.APP_IMAGE }} \
            -t ghcr.io/${{ github.repository_owner }}/travel-booking-app:${{ steps.tag.outputs.image_tag }} \
            ./nextapp

      - name: Push image to GHCR
        if: inputs.image_tag == ''
        run: |
          docker push --all-tags ghcr.io/${{ github.repository_owner }}/travel-booking-app

      - name: Verify image exists in GHCR
        run: |
          image="ghcr.io/${{ github.repository_owner }}/travel-booking-app:${{ steps.tag.outputs.image_tag }}"
          echo "Checking $image"
          docker manifest inspect "$image" > /dev/null

      - name: Open GitHub issue on build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed (${{ inputs.environment }}) — commit ${context.sha.slice(0, 7)}`,
              body: [
                `**Workflow:** \`${context.workflow}\``,
                `**Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                `**Branch:** \`${context.ref}\``,
                `**Actor:** @${context.actor}`,
                `**Commit:** \`${context.sha}\``,
              ].join('\n')
            })

  deploy:
    name: Deploy to EC2 (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env for EC2
        run: |
          mkdir -p app/nginx
          cat > app/.env << 'EOF'
          NODE_ENV=production
          PORT=5173

          APP_IMAGE=ghcr.io/${{ github.repository_owner }}/travel-booking-app:${{ needs.build.outputs.image_tag }}

          POSTGRES_USER=${{ secrets.postgres_user }}
          POSTGRES_PASSWORD=${{ secrets.postgres_password }}
          POSTGRES_DB=${{ secrets.postgres_db }}
          DATABASE_URL=postgresql://${{ secrets.postgres_user }}:${{ secrets.postgres_password }}@postgres:5432/${{ secrets.postgres_db }}?schema=public

          REDIS_URL=redis://redis:6379

          JWT_SECRET=${{ secrets.jwt_secret }}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${{ secrets.jwt_refresh_secret }}
          JWT_REFRESH_EXPIRES_IN=7d

          # Same-origin in production (nginx proxies everything to `app`), so
          # this only matters if a separate domain later points at the API.
          CORS_ORIGIN=http://${{ secrets.ec2_host }}
          PUBLIC_URL=http://${{ secrets.ec2_host }}

          BOOKING_HOLD_MINUTES=10
          FILE_STORAGE_DRIVER=local
          PAYMENT_GATEWAY=${{ secrets.payment_gateway || 'mock' }}

          EMAIL_PROVIDER=${{ secrets.email_provider || 'console' }}
          SMTP_HOST=${{ secrets.smtp_host }}
          SMTP_PORT=${{ secrets.smtp_port || '587' }}
          SMTP_USER=${{ secrets.smtp_user }}
          SMTP_PASSWORD=${{ secrets.smtp_password }}
          SMTP_FROM=${{ secrets.smtp_from || '"Global Travel Agency <no-reply@example.com>"' }}

          SMS_PROVIDER=${{ secrets.sms_provider || 'none' }}
          WHATSAPP_PROVIDER=${{ secrets.whatsapp_provider || 'none' }}
          EOF

      # Single `app` service now; nginx proxies everything to it on 5173,
      # instead of splitting /api/* to a separate backend:4000.
      - name: Write docker-compose.prod.yml for EC2
        run: |
          cat > app/docker-compose.prod.yml << 'EOF'
          name: travel-booking

          services:
            postgres:
              image: postgres:16-alpine
              container_name: booking_postgres
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: ${POSTGRES_DB}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
                interval: 5s
                timeout: 5s
                retries: 10
              networks:
                - booking_network

            redis:
              image: redis:7-alpine
              container_name: booking_redis
              restart: unless-stopped
              volumes:
                - redis_data:/data
              healthcheck:
                test: ['CMD', 'redis-cli', 'ping']
                interval: 5s
                timeout: 5s
                retries: 10
              networks:
                - booking_network

            app:
              image: ${APP_IMAGE}
              container_name: booking_app
              restart: unless-stopped
              env_file:
                - .env
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              healthcheck:
                test: ['CMD', 'node', '-e', "fetch('http://localhost:5173/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
                interval: 10s
                timeout: 5s
                retries: 10
                start_period: 15s
              volumes:
                # UPLOAD_ROOT in server/services/uploadService.js is
                # process.cwd()/uploads; the standalone build's server.js runs
                # from /app, so that's /app/uploads (served by
                # app/uploads/[...path]/route.js), not /app/public/uploads.
                - app_uploads:/app/uploads
              networks:
                - booking_network

            nginx:
              image: nginx:1.27-alpine
              container_name: booking_nginx
              restart: unless-stopped
              depends_on:
                app:
                  condition: service_healthy
              ports:
                - '80:80'
              volumes:
                - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
              healthcheck:
                test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 10s
              networks:
                - booking_network

          networks:
            booking_network:
              driver: bridge

          volumes:
            postgres_data:
            redis_data:
            app_uploads:
          EOF

      - name: Write nginx reverse-proxy vhost for EC2
        run: |
          cat > app/nginx/default.conf << 'EOF'
          upstream app_upstream {
              server app:5173;
              keepalive 16;
          }

          server {
              listen 80;
              server_name _;

              client_max_body_size 20m;
              server_tokens off;

              add_header X-Content-Type-Options nosniff always;
              add_header X-Frame-Options SAMEORIGIN always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;

              gzip on;
              gzip_proxied any;
              gzip_comp_level 5;
              gzip_min_length 512;
              gzip_types text/plain text/css application/javascript application/json image/svg+xml;

              location = /healthz {
                  access_log off;
                  add_header Content-Type text/plain;
                  return 200 "ok\n";
              }

              # Next emits content-hashed filenames under /_next/static, so a
              # given URL's bytes never change and can be cached indefinitely.
              location /_next/static/ {
                  proxy_pass         http://app_upstream;
                  proxy_http_version 1.1;
                  proxy_set_header   Connection "";
                  proxy_set_header   Host $host;
                  proxy_hide_header  Cache-Control;
                  add_header         Cache-Control "public, max-age=31536000, immutable" always;
              }

              location / {
                  proxy_pass         http://app_upstream;
                  proxy_http_version 1.1;
                  proxy_set_header   Host $host;
                  proxy_set_header   X-Real-IP $remote_addr;
                  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_set_header   Upgrade $http_upgrade;
                  proxy_set_header   Connection $connection_upgrade;
                  proxy_read_timeout 60s;
                  proxy_buffering    off;
              }
          }
          EOF

          printf '%s\n%s\n' \
            'map $http_upgrade $connection_upgrade { default upgrade; "" close; }' \
            "$(cat app/nginx/default.conf)" > app/nginx/default.conf.tmp
          mv app/nginx/default.conf.tmp app/nginx/default.conf

      - name: Set up SSH agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-keyscan -H ${{ secrets.ec2_host }} >> ~/.ssh/known_hosts
          ssh-add - <<< "${{ secrets.ssh_private_key }}"

      - name: Ensure ~/app directory exists on EC2
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.ssh_user }}@${{ secrets.ec2_host }} \
            "mkdir -p ~/app/nginx"

      - name: Copy files to EC2
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          scp -o StrictHostKeyChecking=no \
            app/.env \
            app/docker-compose.prod.yml \
            ${{ secrets.ssh_user }}@${{ secrets.ec2_host }}:~/app/

          scp -o StrictHostKeyChecking=no \
            app/nginx/default.conf \
            ${{ secrets.ssh_user }}@${{ secrets.ec2_host }}:~/app/nginx/

      - name: Deploy on EC2
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.ssh_user }}@${{ secrets.ec2_host }} << 'ENDSSH'
            set -euo pipefail
            cd ~/app

            set -a && source .env && set +a

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "$APP_IMAGE"

            COMPOSE="docker compose --env-file=.env -f docker-compose.prod.yml"

            $COMPOSE up -d postgres redis

            echo "Waiting for Postgres to accept connections..."
            for _ in $(seq 1 30); do
              if $COMPOSE exec -T postgres \
                   pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                echo "Postgres is ready."
                break
              fi
              sleep 2
            done

            echo "Applying database migrations..."
            $COMPOSE run --rm --no-deps app npm run db:migrate

            echo "Validating nginx configuration..."
            docker run --rm -v ~/app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
              --add-host app:127.0.0.1 \
              nginx:1.27-alpine nginx -t

            $COMPOSE up -d --remove-orphans

            docker image prune -f

            docker logout ghcr.io
            echo "Deploy complete."
          ENDSSH

      - name: Health check
        run: |
          BASE="http://${{ secrets.ec2_host }}"
          STATUS=000

          for attempt in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE/" || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              break
            fi
            echo "Attempt $attempt: app $STATUS — retrying in 6s"
            sleep 6
          done

          echo "App (via nginx): HTTP $STATUS"

          if [[ "$STATUS" != "200" ]]; then
            echo "Health check failed — inspect container logs on the instance:"
            echo "  ssh <user>@${{ secrets.ec2_host }} 'cd ~/app && docker compose -f docker-compose.prod.yml logs --tail=100'"
            exit 1
          fi

      - name: Run smoke tests
        run: |
          BASE_URL="http://${{ secrets.ec2_host }}" \
          API_URL="http://${{ secrets.ec2_host }}/api/v1" \
          WEB_URL="http://${{ secrets.ec2_host }}" \
          CHECK_DEV_TOOLS=0 \
          ./.github/scripts/smoke.sh
