# Deploys to the staging EC2 instance on every push to `develop`, or on
# demand. Secrets are STAGING_-prefixed in the repo/environment settings and
# mapped here onto the generic names _deploy.yml expects.
name: Deploy — Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag (commit SHA) to deploy. Leave blank to build this ref.'
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image_tag: ${{ inputs.image_tag || '' }}
    secrets:
      ec2_host: ${{ secrets.STAGING_EC2_HOST }}
      ssh_user: ${{ secrets.STAGING_SSH_USER }}
      ssh_private_key: ${{ secrets.STAGING_SSH_KEY }}
      postgres_user: ${{ secrets.STAGING_POSTGRES_USER }}
      postgres_password: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      postgres_db: ${{ secrets.STAGING_POSTGRES_DB }}
      jwt_secret: ${{ secrets.STAGING_JWT_SECRET }}
      jwt_refresh_secret: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
      payment_gateway: ${{ secrets.STAGING_PAYMENT_GATEWAY }}
      email_provider: ${{ secrets.STAGING_EMAIL_PROVIDER }}
      smtp_host: ${{ secrets.STAGING_SMTP_HOST }}
      smtp_port: ${{ secrets.STAGING_SMTP_PORT }}
      smtp_user: ${{ secrets.STAGING_SMTP_USER }}
      smtp_password: ${{ secrets.STAGING_SMTP_PASSWORD }}
      smtp_from: ${{ secrets.STAGING_SMTP_FROM }}
      sms_provider: ${{ secrets.STAGING_SMS_PROVIDER }}
      whatsapp_provider: ${{ secrets.STAGING_WHATSAPP_PROVIDER }}
