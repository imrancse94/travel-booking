# Production deployment to AWS: ECR -> ECS/Fargate behind an ALB, with RDS
# PostgreSQL and ElastiCache Redis (see documentation/deployment.md).
#
# Shape of a run:
#   build     push both images, tagged with the commit SHA (immutable)
#   migrate   register a new backend task definition revision pinned to that
#             image, then run `prisma migrate deploy` as a one-off task on
#             THAT revision -- the new code's schema lands before any task
#             serving the new code starts
#   deploy    roll both services onto their new revisions, wait for stability,
#             probe the ALB, and roll back both services if the probe fails
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (commit SHA). Leave blank to build from this ref -- set it to redeploy or roll back to a previous build.'
        required: false
        type: string

permissions:
  id-token: write # AWS OIDC -- no long-lived access keys are stored
  contents: read

# Never cancel a deployment halfway through, and never run two at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND }}
  ECR_REPOSITORY_FRONTEND: ${{ vars.ECR_REPOSITORY_FRONTEND }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE_BACKEND: ${{ vars.ECS_SERVICE_BACKEND }}
  ECS_SERVICE_FRONTEND: ${{ vars.ECS_SERVICE_FRONTEND }}
  ECS_TASK_DEFINITION_BACKEND: ${{ vars.ECS_TASK_DEFINITION_BACKEND }}
  ECS_TASK_DEFINITION_FRONTEND: ${{ vars.ECS_TASK_DEFINITION_FRONTEND }}
  # Container names inside those task definitions (what --overrides targets).
  ECS_CONTAINER_BACKEND: ${{ vars.ECS_CONTAINER_BACKEND || 'backend' }}
  ECS_CONTAINER_FRONTEND: ${{ vars.ECS_CONTAINER_FRONTEND || 'frontend' }}
  ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
  ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
  HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Images are tagged with the commit SHA and deployed by that exact tag, so
      # a deployment is reproducible and a rollback is just a re-run of this
      # workflow with an older tag. `latest` is published for convenience only
      # and is never what a task definition references.
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_SHA"; fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      - name: Skip build when redeploying an existing tag
        id: skip
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "reason=redeploying an already-built tag" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build and push frontend image
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      # Fails fast if a manual redeploy names a tag that was never pushed.
      - name: Verify both images exist in ECR
        run: |
          for repo in "$ECR_REPOSITORY_BACKEND" "$ECR_REPOSITORY_FRONTEND"; do
            aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageTag=${{ steps.tag.outputs.image_tag }} \
              --query 'imageDetails[0].imageDigest' --output text
          done

  migrate:
    name: Migrate the database
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    environment: production # gate migrations + rollout behind any required approval
    outputs:
      backend_task_definition: ${{ steps.register.outputs.arn }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register the revision FIRST so the migration runs on the new image --
      # the schema change belongs to the code being deployed, and running it on
      # the currently-deployed revision would apply an older codebase's
      # migrations.
      - name: Register backend task definition revision
        id: register
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_BACKEND" \
            --query 'taskDefinition' > current.json

          # Strip the read-only fields describe-task-definition returns, which
          # register-task-definition rejects.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            current.json > base.json

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:${{ needs.build.outputs.image_tag }}"
          jq --arg name "$ECS_CONTAINER_BACKEND" --arg image "$IMAGE" \
            '.containerDefinitions = (.containerDefinitions
               | map(if .name == $name then .image = $image else . end))' \
            base.json > rendered.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://rendered.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $ARN with image $IMAGE"

      - name: Run "prisma migrate deploy" as a one-off task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --launch-type FARGATE \
            --started-by "gha-migrate-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --overrides "$(jq -nc --arg name "$ECS_CONTAINER_BACKEND" \
                '{containerOverrides:[{name:$name,command:["npx","prisma","migrate","deploy"]}]}')" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "Failed to start the migration task"
            exit 1
          fi
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task exited with code '$EXIT_CODE' ($REASON)"
            if [ -n "${{ vars.CLOUDWATCH_LOG_GROUP_BACKEND }}" ]; then
              aws logs tail "${{ vars.CLOUDWATCH_LOG_GROUP_BACKEND }}" --since 15m || true
            fi
            exit 1
          fi
          echo "Migrations applied"

  deploy:
    name: Roll out ECS services
    runs-on: ubuntu-latest
    needs: [build, migrate]
    timeout-minutes: 45
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Captured before anything changes, so a failed health check can put both
      # services back exactly where they were.
      - name: Record the currently deployed revisions
        id: previous
        run: |
          BACKEND=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_BACKEND" \
            --query 'services[0].taskDefinition' --output text)
          FRONTEND=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_FRONTEND" \
            --query 'services[0].taskDefinition' --output text)
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Current: backend=$BACKEND frontend=$FRONTEND"

      - name: Register frontend task definition revision
        id: frontend_revision
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FRONTEND" \
            --query 'taskDefinition' > current.json

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            current.json > base.json

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:${{ needs.build.outputs.image_tag }}"
          jq --arg name "$ECS_CONTAINER_FRONTEND" --arg image "$IMAGE" \
            '.containerDefinitions = (.containerDefinitions
               | map(if .name == $name then .image = $image else . end))' \
            base.json > rendered.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://rendered.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $ARN with image $IMAGE"

      # The backend revision was already registered (and migrated against) by
      # the migrate job -- deploy that same revision rather than a new one.
      - name: Deploy backend
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE_BACKEND" \
            --task-definition "${{ needs.migrate.outputs.backend_task_definition }}" \
            --no-cli-pager --query 'service.serviceName' --output text

      - name: Deploy frontend
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE_FRONTEND" \
            --task-definition "${{ steps.frontend_revision.outputs.arn }}" \
            --no-cli-pager --query 'service.serviceName' --output text

      - name: Wait for both services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_BACKEND" "$ECS_SERVICE_FRONTEND"

      # ECS reporting "stable" only means tasks are running and passing their
      # target-group health checks; this proves the ALB actually serves the API.
      - name: Health check through the load balancer
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_CHECK_URL"; then
              echo
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "Health check never passed"
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::warning::Deployment failed -- rolling both services back"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_BACKEND" \
            --task-definition "${{ steps.previous.outputs.backend }}" --no-cli-pager --query 'service.serviceName' --output text
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_FRONTEND" \
            --task-definition "${{ steps.previous.outputs.frontend }}" --no-cli-pager --query 'service.serviceName' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_BACKEND" "$ECS_SERVICE_FRONTEND"
          echo "Rolled back to backend=${{ steps.previous.outputs.backend }} frontend=${{ steps.previous.outputs.frontend }}"
          echo "::warning::Database migrations are NOT rolled back -- this schema is additive by convention (documentation/database.md), so the previous revision runs against it."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`${{ needs.build.outputs.image_tag }}\` |"
            echo "| Backend task definition | \`${{ needs.migrate.outputs.backend_task_definition }}\` |"
            echo "| Frontend task definition | \`${{ steps.frontend_revision.outputs.arn }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
