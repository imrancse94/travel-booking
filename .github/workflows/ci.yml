# CI for the single Next.js app (nextapp/), which now serves both the UI and
# the former Express API routes under app/api/v1/**.
#
#   test   lint + vitest against a throwaway Postgres and Redis, after
#          applying migrations
#   build  docker build of the nextapp production image (no push -- pushing
#          and deploying is handled by the reusable _deploy.yml workflow)
#
# Runs on every push and pull request, any branch.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextapp

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: booking_password
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_user -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://booking_user:booking_password@localhost:5432/booking_test
      # See docker-compose.yml / previous backend CI: the double-booking guard
      # holds a connection per in-flight transaction, so the pool has to stay
      # above the concurrency suite's simultaneous request count.
      DATABASE_POOL_MAX: 25
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      EMAIL_PROVIDER: console
      PAYMENT_GATEWAY: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nextapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target production \
            -t travel-booking-app:ci \
            ./nextapp
